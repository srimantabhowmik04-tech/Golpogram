name: Build Golpogram Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # v3 এর জায়গায় আধুনিক ও অপ্টিমাইজড setup-java ব্যবহার করা হয়েছে
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Scaffold
        run: flutter create . --platforms=android --org com.golpogram

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split Release APKs (Small Size)
        run: flutter build apk --release --split-per-abi

      - name: Upload Small Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: golpogram-small-apks
          path: build/app/outputs/flutter-apk/*.apk
