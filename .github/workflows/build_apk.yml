name: Build Golpogram Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Scaffold
        run: flutter create . --platforms=android --org com.golpogram

      - name: Create Google Services Config if Missing
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123456789","project_id":"golpogram-app","storage_bucket":"golpogram.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.golpogram"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key"}],"services":{"analytics_service":{"status":1}}}]}' > android/app/google-services.json
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload Small Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: golpogram-small-apks
          path: build/app/outputs/flutter-apk/*.apk
